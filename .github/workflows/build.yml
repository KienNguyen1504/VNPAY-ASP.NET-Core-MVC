
name: Build ASP.NET Core .NET 8

on:
  push:
    branches:
      - feature/vnpay-return-url
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./VnPayMvc.Web.csproj

      - name: Build project
        run: dotnet build ./VnPayMvc.Web.csproj --configuration Release --no-restore
